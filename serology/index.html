<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serology & Blood Banking Study Cards</title>
<style>
/* Layout: chapter list (home) and one study card at a time; accent colour comes from each book's cover. */
:root {
  --bg: #F3F6F6; --surface: #FFFFFF; --ink: #15282C; --muted: #5A6E72; --line: #D5E0E1;
  --accent: #0F5C6B; --accent-soft: #E1EEF0; --red: #B8233A; --red-soft: #FBE7EA;
  --good: #1E7A4C; --good-soft: #E2F3EA; --warn: #9A5B00; --warn-soft: #FDF1DC;
  --f-display: "Segoe UI Variable Display", "SF Pro Display", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --f-body: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1A1C; --surface: #15262A; --ink: #E6EFF0; --muted: #9BB0B3; --line: #2A4045;
  --accent: #5FB7C6; --accent-soft: #193A40; --red: #F06E80; --red-soft: #3A1C22;
  --good: #63CF95; --good-soft: #17352A; --warn: #F0B45A; --warn-soft: #3A2C14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1A1C; --surface: #15262A; --ink: #E6EFF0; --muted: #9BB0B3; --line: #2A4045;
  --accent: #5FB7C6; --accent-soft: #193A40; --red: #F06E80; --red-soft: #3A1C22;
  --good: #63CF95; --good-soft: #17352A; --warn: #F0B45A; --warn-soft: #3A2C14; color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px }
header { display: grid; gap: 4px }
.eyebrow { font: 700 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
h1 { font: 700 clamp(26px, 6vw, 34px)/1.1 var(--f-display); margin: 0; text-wrap: balance }
h2 { font: 700 20px/1.2 var(--f-display); margin: 0 }
.sub { color: var(--muted); margin: 0 }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px }
.chapters { display: grid; gap: 8px }
.chap-btn { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit }
.chap-btn:hover { border-color: var(--accent) }
.chap-title { font-weight: 700; min-width: 0 }
.chap-count { font: 500 13px var(--f-mono); color: var(--muted); white-space: nowrap }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { display: block; height: 100% } .bar .g { background: var(--good) } .bar .a { background: var(--warn) }
.strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.dot { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font: 700 12px var(--f-mono); cursor: pointer; display: grid; place-items: center; padding: 0 }
.dot[aria-current="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.dot.done { background: var(--good-soft); color: var(--good); border-color: transparent }
.dot.again { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.score { margin-left: auto; font: 500 13px var(--f-mono); color: var(--muted) }
.topline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; min-width: 0 }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.chip { font: 700 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent) }
.chap { font-size: 13px; color: var(--muted) }
.q { font: 600 clamp(18px, 4.4vw, 22px)/1.35 var(--f-display); margin: 0; text-wrap: pretty }
.hint { color: var(--muted); margin: 0; font-size: 15px }
.answer { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0 }
.answer p, .feedback p { margin: 0 0 6px } .answer p:last-child, .feedback p:last-child { margin: 0 }
.answer ul, .feedback ul { margin: 4px 0 0; padding-left: 20px }
.row { display: flex; gap: 10px; flex-wrap: wrap }
button.btn { font: 700 15px var(--f-body); padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
button.btn.good { background: var(--good-soft); color: var(--good); border-color: transparent }
button.btn.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent }
button.btn:disabled { opacity: .45; cursor: default }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.nav { display: flex; justify-content: space-between; gap: 10px }
.feedback { padding: 12px 14px; border-radius: 8px; font-size: 15px; display: grid; gap: 4px }
.feedback.ok { background: var(--good-soft); color: var(--good) }
.feedback.no { background: var(--red-soft); color: var(--red) }
.feedback .ink { color: var(--ink) }
.scroll { overflow-x: auto; min-width: 0 }
table.grid { border-collapse: collapse; font: 500 14px var(--f-mono); width: 100% }
.grid th, .grid td { border: 1px solid var(--line); padding: 0; text-align: center; min-width: 38px; height: 40px }
.grid th { background: var(--bg); color: var(--muted); font-weight: 700; padding: 4px 6px; font-family: var(--f-body); font-size: 13px }
.grid th.rowh { text-align: left; padding: 4px 10px; color: var(--ink) }
.grid td.given { color: var(--ink); font-weight: 700; padding: 4px 6px }
.grid td.rx { font-weight: 700; color: var(--red) }
.tap { width: 100%; height: 100%; min-height: 40px; border: 0; background: transparent; color: var(--ink); font: 700 17px var(--f-mono); cursor: pointer; padding: 2px 6px }
.tap.set { color: var(--red) }
.tap.right { background: var(--good-soft) } .tap.wrong { background: var(--red-soft) }
th.ag { cursor: pointer; user-select: none; color: var(--ink) }
th.ag.out, td.out { text-decoration: line-through; color: var(--muted); background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px) }
th.ag.keep { background: var(--red-soft); color: var(--red) }
.calc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.calc input { font: 700 18px var(--f-mono); width: 9ch; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink) }
.facts { font: 500 15px var(--f-mono); background: var(--bg); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px }
ol.steps { margin: 0; padding-left: 20px } ol.steps li { margin: 2px 0 }
.items { display: grid; gap: 8px }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer }
.item .tag { font: 700 12px/1 var(--f-mono); padding: 6px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); white-space: nowrap }
.item .tag.set { background: var(--accent-soft); color: var(--accent) }
.item.right { border-color: var(--good); background: var(--good-soft) } .item.wrong { border-color: var(--red); background: var(--red-soft) }
.item .num { font: 700 13px var(--f-mono); min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--muted) }
.item.picked .num { background: var(--accent); color: var(--surface) }
.legend { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.legend span { font: 700 12px var(--f-mono); padding: 4px 6px; border-radius: 6px; background: var(--bg); color: var(--ink) }
footer { color: var(--muted); font-size: 13px; text-align: center }
.empty { color: var(--muted); padding: 20px; text-align: center }
@media (prefers-reduced-motion: no-preference) { .answer, .feedback { animation: in .18s ease-out } @keyframes in { from { opacity: .4; transform: translateY(3px) } } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DECK = {"id":"sero","title":"Serology &amp; Blood Banking","eyebrow":"Study cards for MLT students","sub":"Pick a chapter. Think of the answer first, then check yourself. Cards you mark Again come back in your review.","footer":"Serology and Blood Banking for MLT Students &middot; Dr. Tarek Faour &middot; 345 cards","chapters":[{
"key": "s1", "title": "Chapter 1: Immunology and Genetics for Blood Banking", "short": "Ch 1 · Immunology & genetics",
"cards": [
{"type": "flip", "q": "What is the difference between an antigen, an immunogen and a hapten?",
 "a": ["<b>Antigen</b>: a molecule that binds to an antibody or a T-cell receptor.", "<b>Immunogen</b>: an antigen that can also <b>elicit</b> an immune response. Not all antigens are immunogens.", "<b>Hapten</b>: a small molecule (below 10,000 D) that needs a <b>carrier</b> to start an immune response."]},
{"type": "sort", "q": "Which factors make an antigen a <b>better</b> immunogen, and which make it a <b>poorer</b> one?",
 "bins": ["Better immunogen", "Poorer immunogen"],
 "items": [{"t": "Protein", "b": 0}, {"t": "Lipid", "b": 1}, {"t": "Molecular weight above 10,000 D", "b": 0}, {"t": "Small hapten without a carrier", "b": 1},
  {"t": "Very different from self (foreign)", "b": 0}, {"t": "Close to self", "b": 1}, {"t": "High dose and antigen density", "b": 0}, {"t": "Intravenous or intramuscular route", "b": 0}],
 "explain": ["Proteins are the best immunogens, then complex carbohydrates; lipids are poor."]},
{"type": "flip", "q": "Transfused red cells carry antigens that are foreign to the recipient but come from the same species. What are such antigens called?",
 "a": ["<b>Allogeneic</b> antigens."]},
{"type": "sort", "q": "Sort each property: IgM or IgG?",
 "bins": ["IgM", "IgG"],
 "items": [{"t": "Pentamer with a J chain", "b": 0}, {"t": "10 antigen-binding sites", "b": 0}, {"t": "Bivalent (2 binding sites)", "b": 1},
  {"t": "About 70–75% of serum immunoglobulins", "b": 1}, {"t": "Agglutinates saline-suspended cells (immediate spin)", "b": 0},
  {"t": "Usually needs AHG to show the reaction", "b": 1}, {"t": "One molecule activates complement", "b": 0}, {"t": "Crosses the placenta", "b": 1},
  {"t": "Optimal reaction cold (4–22 °C)", "b": 0}, {"t": "Rh, Kell, Duffy and Kidd antibodies", "b": 1}, {"t": "Anti-A, anti-B, anti-Le<sup>a</sup>, anti-M, anti-P1", "b": 0}]},
{"type": "flip", "q": "Why can IgM agglutinate saline-suspended red cells while most IgG antibodies cannot?",
 "a": ["IgM is a large pentamer with <b>10 binding sites</b>, so it bridges the gap between red cells.", "IgG is small and bivalent; it coats the cells but usually needs <b>AHG</b> (or an enhancement medium) to show agglutination."]},
{"type": "flip", "q": "Which reagents dissociate IgM, and why are they useful?",
 "a": ["Sulfhydryl reducing agents: <b>2-mercaptoethanol (2-ME)</b> and <b>dithiothreitol (DTT)</b>.", "They cleave the disulfide bonds of the pentamer and J chain, destroying IgM activity while IgG remains."]},
{"type": "flip", "q": "How many IgM and IgG molecules are needed to start the classical complement pathway? Which IgG subclasses are best?",
 "a": ["<b>One IgM</b> molecule, but <b>two IgG</b> molecules close together on the cell.", "<b>IgG1 and IgG3</b> are the most effective at activating complement."]},
{"type": "flip", "q": "Which IgG subclasses are typical of Rh, Kell, Duffy and Kidd antibodies?",
 "a": ["<b>Rh</b>: mostly IgG1 and IgG3.", "<b>Anti-K</b> and <b>anti-Fy</b>: usually IgG1.", "<b>Anti-Jk</b>: mainly IgG3 (often with IgG1)."]},
{"type": "flip", "q": "Which IgG subclass has the shortest half-life, and how long is it?",
 "a": ["<b>IgG3</b>: about <b>7 days</b>, versus about 21 days for the other subclasses. It is a potent pro-inflammatory antibody."]},
{"type": "flip", "q": "What is the difference between polyclonal and monoclonal antibodies? Which are used in modern typing reagents?",
 "a": ["<b>Polyclonal</b>: made by many B-cell clones; molecularly heterogeneous.", "<b>Monoclonal</b>: made by a single clone; biochemically identical.", "Most modern blood typing reagents are <b>monoclonal</b>."]},
{"type": "sort", "q": "Intravascular or extravascular hemolysis?",
 "bins": ["Intravascular", "Extravascular"],
 "items": [{"t": "Usually IgM anti-A or anti-B", "b": 0}, {"t": "Mainly IgG antibodies", "b": 1}, {"t": "Rapid activation of large amounts of complement", "b": 0},
  {"t": "Spleen and liver macrophages remove coated cells", "b": 1}],
 "explain": ["The mode of hemolysis depends mainly on the antibody class and on the activity of the reticuloendothelial system."]},
{"type": "flip", "q": "Do capital and lowercase letters mean dominant and recessive in blood group names?",
 "a": ["<b>No.</b> They only name the antigens. C/c, E/e, K/k and S/s are <b>codominant</b>: a C/c person is C+c+.", "D and d only look dominant and recessive because <b>d means the absence of D</b>."]},
{"type": "flip", "q": "Define codominance, and name the usual inheritance pattern of blood group systems.",
 "a": ["In <b>codominance</b>, both alleles are equally expressed in a heterozygote.", "Most blood group systems, including ABO, are inherited in a <b>codominant</b> way."]},
{"type": "flip", "q": "What is the basis of the dosage effect?",
 "a": ["<b>Homozygous</b> people may carry more antigen on their red cells than <b>heterozygous</b> people, so some antibodies react more strongly with homozygous cells."]},
{"type": "flip", "q": "50 people are tested for hemoglobin type: 20 HbA only, 20 HbA + HbS, 10 HbS only. What is the frequency of the <i>S</i> allele?",
 "a": ["100 alleles in total. <i>S</i> alleles = 20 (in the 10 HbS/HbS) + 20 (in the HbA/HbS) = 40.", "Frequency of <i>S</i> = 40 ÷ 100 = <b>0.40</b>; frequency of <i>A</i> = 0.60. Allele frequencies at a locus add up to 1."]},
{"type": "calc", "kind": "hw"},
{"type": "sort", "q": "Relationship testing (maternity assumed): is the alleged father excluded?",
 "bins": ["Direct exclusion", "Indirect exclusion", "Not excluded"],
 "items": [{"t": "Mother group O, child group B, alleged father group A", "b": 0},
  {"t": "Mother Jk(a+b−), child Jk(a+b−), alleged father Jk(a−b+)", "b": 1},
  {"t": "Mother group O, child group A, alleged father group AB", "b": 2},
  {"t": "Mother group A, child group AB, alleged father group O", "b": 0}],
 "explain": ["<b>Direct</b>: the child has a marker absent from both mother and alleged father (the obligatory gene).", "<b>Indirect</b>: the child lacks a marker the father should pass to all children. A silent allele can cause it, so it is never the only marker used."]},
{"type": "flip", "q": "How is relationship (paternity) testing done today?",
 "a": ["By <b>DNA analysis</b>, mainly <b>short tandem repeat (STR)</b> typing, giving a probability of paternity above 99.99%. Blood group and HLA typing are no longer used."]}
]},{
"key": "s2", "title": "Chapter 2: ABO, H and Lewis Blood Group Systems", "short": "Ch 2 · ABO, H & Lewis",
"cards": [
{"type": "flip", "q": "Define a blood group. Why must the detecting antibody be an alloantibody?",
 "a": ["An <b>inherited character of the red cell surface, detected by a specific alloantibody</b>.", "An alloantibody means that <b>some individuals lack</b> the blood group. Polymorphisms detected only by DNA sequencing are not blood groups."]},
{"type": "flip", "q": "How many blood group systems does the ISBT recognize, and give the ISBT numbers of ABO, MNS, P1PK and Rh.",
 "a": ["<b>49 systems</b> (2026), more than 360 red cell antigens.", "ABO <b>001</b>, MNS <b>002</b>, P1PK <b>003</b>, Rh <b>004</b>."]},
{"type": "sort", "q": "Where does ISBT place each antigen?",
 "bins": ["System", "Collection (200 series)", "700 series", "901 series"],
 "items": [{"t": "Antigens controlled by one gene locus that is identified, sequenced and mapped", "b": 0},
  {"t": "Related antigens that do not meet the criteria for a system", "b": 1},
  {"t": "Low-frequency antigens that cannot be placed in a system or collection", "b": 2},
  {"t": "High-frequency antigens that cannot be placed in a system or collection", "b": 3}]},
{"type": "flip", "q": "What frequencies define a high-frequency (public) and a low-frequency (private) antigen?",
 "a": ["<b>High-frequency</b>: present in more than 90–99% of people.", "<b>Low-frequency</b>: present in less than 1%."]},
{"type": "sort", "q": "Match each blood group molecule to its function.",
 "bins": ["Membrane transporter", "Receptor / adhesion", "Complement regulation", "Enzyme"],
 "items": [{"t": "Kidd (urea)", "b": 0}, {"t": "Diego (band 3)", "b": 0}, {"t": "Rh and RhAG", "b": 0}, {"t": "Duffy (chemokine receptor)", "b": 1},
  {"t": "Lutheran", "b": 1}, {"t": "Cromer (CD55, DAF)", "b": 2}, {"t": "Knops (CR1, CD35)", "b": 2}, {"t": "Kell (endopeptidase)", "b": 3}]},
{"type": "flip", "q": "How do type 1 and type 2 precursor chains differ, and where is each found?",
 "a": ["Linkage of galactose to N-acetylglucosamine: <b>β1→3 in type 1</b>, <b>β1→4 in type 2</b>.", "<b>Red cells</b>: ABH mainly on <b>type 2</b> chains. <b>Secretions</b>: mainly on <b>type 1</b> chains (glycoproteins)."]},
{"type": "sort", "q": "Which immunodominant sugar gives each antigen its specificity?",
 "bins": ["L-fucose", "N-acetyl-D-galactosamine", "D-galactose"],
 "items": [{"t": "H antigen", "b": 0}, {"t": "A antigen", "b": 1}, {"t": "B antigen", "b": 2}]},
{"type": "grid", "q": "Fill in the expected forward and reverse grouping.",
 "groups": [["Forward (patient cells)", 2], ["Reverse (patient plasma)", 2]],
 "cols": ["Anti-A", "Anti-B", "A<sub>1</sub> cells", "B cells"], "symbols": ["4+", "0"],
 "variants": [
  {"q": "The patient is group <b>A</b>. Fill in the expected reactions.", "answer": [["4+", "0", "0", "4+"]], "explain": ["Group A: A antigen on the cells; anti-B in the plasma. Forward and reverse grouping must agree."]},
  {"q": "The patient is group <b>B</b>. Fill in the expected reactions.", "answer": [["0", "4+", "4+", "0"]], "explain": ["Group B: B antigen on the cells; anti-A in the plasma."]},
  {"q": "The patient is group <b>O</b>. Fill in the expected reactions.", "answer": [["0", "0", "4+", "4+"]], "explain": ["Group O: no A or B antigen; anti-A, anti-B (and anti-A,B) in the plasma."]},
  {"q": "The patient is group <b>AB</b>. Fill in the expected reactions.", "answer": [["4+", "4+", "0", "0"]], "explain": ["Group AB: both antigens; no ABO antibodies (Landsteiner's rule)."]}]},
{"type": "flip", "q": "State Landsteiner's rule.",
 "a": ["If an antigen is <b>present</b> on the red cells, the corresponding antibody is <b>absent</b> from the plasma; if the antigen is absent, the antibody is (normally) present."]},
{"type": "flip", "q": "A father is A/O and a mother is B/O. Which ABO groups can their children have?",
 "a": ["<b>All four</b>: A/B (AB), A/O (A), B/O (B) and O/O (O). A and B are codominant; O is an amorph."]},
{"type": "sort", "q": "Which gene controls each of these?",
 "bins": ["H gene (FUT1)", "Se gene (FUT2)", "ABO gene", "Le gene (FUT3)"],
 "items": [{"t": "ABH antigens on red cells (type 2 H)", "b": 0}, {"t": "ABH antigens in saliva (type 1 H)", "b": 1},
  {"t": "Converts H into A or B", "b": 2}, {"t": "Adds fucose to type 1 chains to make Le<sup>a</sup> or Le<sup>b</sup>", "b": 3}],
 "explain": ["FUT1, FUT2 and FUT3 are on chromosome 19; ABO is on chromosome 9. About 80% of people are secretors."]},
{"type": "order", "q": "Order the blood groups from the <b>most</b> H antigen to the <b>least</b>.",
 "steps": ["O", "A<sub>2</sub>", "B", "A<sub>2</sub>B", "A<sub>1</sub>", "A<sub>1</sub>B"],
 "explain": ["Group O cells are richest in H because the O allele does not convert H into A or B."]},
{"type": "flip", "q": "When do ABH antigens appear, and when do they reach adult levels? Why is ABO called a histo-blood group system?",
 "a": ["They appear at <b>5–6 weeks of gestation</b>, are weak at birth, and reach adult levels at <b>2–4 years</b>.", "They are found on almost all body cells (except connective tissue and the CNS), hence <b>histo</b>-blood group."]},
{"type": "flip", "q": "Give two quantitative and qualitative differences between A<sub>1</sub> and A<sub>2</sub> cells.",
 "a": ["<b>Quantitative</b>: about 1 million A sites on A<sub>1</sub> cells versus 250,000 on A<sub>2</sub>.", "<b>Qualitative</b>: A<sub>1</sub> cells are agglutinated by <i>Dolichos biflorus</i> lectin (anti-A<sub>1</sub>); A<sub>2</sub> cells are not, and have more H.", "A<sub>2</sub> is about 20% of group A people."]},
{"type": "flip", "q": "How often is anti-A<sub>1</sub> found, and is it clinically significant?",
 "a": ["In about <b>1–8% of A<sub>2</sub></b> and <b>22–35% of A<sub>2</sub>B</b> people (also in A<sub>x</sub> and A<sub>3</sub>).", "Naturally occurring; usually <b>not clinically significant</b>."]},
{"type": "flip", "q": "A patient types as group O, but their serum agglutinates group O cells. What is the phenotype, its genetics, and what blood can they receive?",
 "a": ["<b>Bombay phenotype (O<sub>h</sub>)</b>: <i>h/h</i> (inactive FUT1) and <i>se/se</i>, so no H, A or B on cells or in secretions.", "Strong anti-H, anti-A, anti-B and anti-A,B. Only <b>Bombay blood</b> can be given."]},
{"type": "flip", "q": "When do ABO antibodies start, peak and decline?",
 "a": ["Production starts at <b>3–6 months</b>, peaks at <b>5–10 years</b>, then slowly declines with age.", "After 6 months of age it is rare to lack the expected antibodies."]},
{"type": "sort", "q": "Sort these ABO antibody features by blood group.",
 "bins": ["Groups A and B", "Group O"],
 "items": [{"t": "Mainly IgM anti-A or anti-B", "b": 0}, {"t": "More IgG anti-A and anti-B (ABO HDFN)", "b": 1}, {"t": "Anti-A,B, mostly IgG", "b": 1}],

const KEY = 'studycards-' + DECK.id;
let status = {};
try { status = JSON.parse(localStorage.getItem(KEY) || '{}') || {} } catch (e) { status = {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(status)) } catch (e) {} }
const app = document.getElementById('app');
const esc = s => String(s);
const plain = s => String(s).replace(/<[^>]+>/g, '');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (lo, hi, step) => { const n = Math.round((hi - lo) / step); return +(lo + step * Math.floor(Math.random() * (n + 1))).toFixed(4) };
const fmt = (x, d) => (+x).toFixed(d);

// every card gets a stable id: chapter key + position
const ALL = [];
DECK.chapters.forEach(ch => ch.cards.forEach((c, i) => { c._id = ch.key + '.' + (i + 1); c._ch = ch; ALL.push(c) }));

let list = [], idx = 0, mode = '';

function home() {
  mode = 'home';
  const again = ALL.filter(c => status[c._id] === 'again').length;
  const done = ALL.filter(c => status[c._id] === 'done').length;
  app.innerHTML = '<a class="eyebrow" href="../" style="text-decoration:none">← All books</a><header><div class="eyebrow">' + DECK.eyebrow + '</div><h1>' + DECK.title + '</h1><p class="sub">' + DECK.sub + '</p></header>' +
    '<div class="toolbar"><button class="btn primary" id="mixed">Mixed review (all chapters)</button>' +
    '<button class="btn warn" id="again"' + (again ? '' : ' disabled') + '>Review my “Again” cards (' + again + ')</button></div>' +
    '<p class="sub">' + done + ' of ' + ALL.length + ' cards marked “Got it”.</p>' +
    '<div class="chapters">' + DECK.chapters.map((ch, k) => {
      const n = ch.cards.length, g = ch.cards.filter(c => status[c._id] === 'done').length, a = ch.cards.filter(c => status[c._id] === 'again').length;
      return '<button class="chap-btn" data-k="' + k + '"><span class="chap-title">' + ch.title + '</span><span class="chap-count">' + g + '/' + n + '</span>' +
        '<span class="bar"><i class="g" style="width:' + (100 * g / n) + '%"></i><i class="a" style="width:' + (100 * a / n) + '%"></i></span></button>';
    }).join('') + '</div>' +
    '<div class="toolbar"><button class="btn" id="reset">Clear my progress</button></div><div id="confirm"></div>' +
    '<footer>' + DECK.footer + '</footer>';
  app.querySelectorAll('.chap-btn').forEach(b => b.onclick = () => start(DECK.chapters[+b.dataset.k].cards, DECK.chapters[+b.dataset.k].title));
  document.getElementById('mixed').onclick = () => start(shuffle(ALL).slice(0, 30), 'Mixed review · 30 random cards');
  document.getElementById('again').onclick = () => start(ALL.filter(c => status[c._id] === 'again'), 'Cards marked “Again”');
  document.getElementById('reset').onclick = () => {
    document.getElementById('confirm').innerHTML = '<div class="feedback no"><p class="ink">Clear all your progress for this book? This cannot be undone.</p><div class="row"><button class="btn warn" id="yes">Clear progress</button><button class="btn" id="no">Keep it</button></div></div>';
    document.getElementById('yes').onclick = () => { status = {}; save(); home() };
    document.getElementById('no').onclick = () => document.getElementById('confirm').innerHTML = '';
  };
  window.scrollTo(0, 0);
}

let setTitle = '';
function start(cards, title) { if (!cards.length) return; list = cards; idx = 0; setTitle = title; mode = 'study'; study() }

function study() {
  app.innerHTML = '<div class="topline"><button class="btn" id="back">← Chapters</button><h2>' + setTitle + '</h2></div>' +
    '<div class="strip" id="strip"></div><section class="card" id="card" aria-live="polite"></section>' +
    '<div class="nav"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>' +
    '<footer>' + DECK.footer + '</footer>';
  document.getElementById('back').onclick = home;
  document.getElementById('prev').onclick = () => go(idx - 1);
  document.getElementById('next').onclick = () => go(idx + 1);
  go(0);
}
function drawStrip() {
  const strip = document.getElementById('strip'); if (!strip) return;
  strip.innerHTML = list.map((c, i) => '<button class="dot' + (status[c._id] === 'done' ? ' done' : status[c._id] === 'again' ? ' again' : '') +
    '" data-i="' + i + '" aria-label="Card ' + (i + 1) + '" aria-current="' + (i === idx) + '">' + (i + 1) + '</button>').join('') +
    '<span class="score">' + list.filter(c => status[c._id] === 'done').length + ' / ' + list.length + ' got it</span>';
  strip.querySelectorAll('.dot').forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i) {
  idx = Math.max(0, Math.min(list.length - 1, i));
  const c = list[idx], el = document.getElementById('card');
  (R[c.type] || R.flip)(c, el);
  drawStrip();
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === list.length - 1;
}
document.addEventListener('keydown', e => {
  if (mode !== 'study' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1);
});

const LABEL = { flip: 'Flip', grid: 'Fill the grid', panel: 'Rule out', calc: 'Calculate', sort: 'Sort', order: 'Put in order' };
function head(c) { return '<div class="meta"><span class="chip">' + LABEL[c.type] + '</span><span class="chap">' + c._ch.short + '</span></div>' }
function rate(box) {
  box.insertAdjacentHTML('beforeend', '<div class="row"><button class="btn good" data-r="done">Got it</button><button class="btn warn" data-r="again">Again</button></div>');
  box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { status[list[idx]._id] = b.dataset.r; save(); if (idx < list.length - 1) go(idx + 1); else drawStrip() });
}
function paras(a) { return (Array.isArray(a) ? a : [a]).map(p => '<p>' + p + '</p>').join('') }
function fb(el, ok, html) { const f = el.querySelector('.fb'); f.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' + html + '</div>'; if (ok !== null) rate(f) }

const R = {
  flip(c, el) {
    el.innerHTML = head(c) + '<p class="q">' + c.q + '</p><p class="hint">Answer in your head, then flip the card.</p><div class="row"><button class="btn primary" id="flip">Show answer</button></div>';
    el.querySelector('#flip').onclick = () => {
      el.innerHTML = head(c) + '<p class="q">' + c.q + '</p><div class="answer">' + paras(c.a) + '</div><div class="fb"></div>';
      rate(el.querySelector('.fb'));

  },
  grid(c, el) {
    const v = c.variants ? pick(c.variants) : c;
    const sym = c.symbols || ['+', '0'];
    const rows = v.answer.length, cols = c.cols.length;
    const state = v.answer.map((r, i) => r.map((x, j) => (v.given && v.given[i] && v.given[i][j] != null) ? null : ''));
    let h = head(c) + '<p class="q">' + (v.q || c.q) + '</p><p class="hint">' + (c.hint || 'Tap each empty cell to cycle through the possible results, then check.') + '</p>' +
      '<div class="legend">Tap to cycle: ' + sym.map(s => '<span>' + s + '</span>').join('') + (c.legend ? ' · ' + c.legend : '') + '</div>' +
      '<div class="scroll"><table class="grid"><thead>';
    if (c.groups) h += '<tr>' + (c.rows ? '<th></th>' : '') + c.groups.map(g => '<th colspan="' + g[1] + '">' + g[0] + '</th>').join('') + '</tr>';
    h += '<tr>' + (c.rows || v.rows ? '<th></th>' : '') + c.cols.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
    const rlab = v.rows || c.rows;
    for (let i = 0; i < rows; i++) {
      h += '<tr>' + (rlab ? '<th class="rowh">' + rlab[i] + '</th>' : '');
      for (let j = 0; j < cols; j++) {
        const g = v.given && v.given[i] && v.given[i][j] != null ? v.given[i][j] : null;
        h += g !== null ? '<td class="given">' + g + '</td>' : '<td><button class="tap" data-i="' + i + '" data-j="' + j + '" aria-label="' + plain((rlab ? rlab[i] + ', ' : '') + c.cols[j]) + '">·</button></td>';
      }
      h += '</tr>';
    }
    h += '</tbody></table></div><div class="row"><button class="btn primary" id="chk">Check</button>' + (c.variants ? '<button class="btn" id="nw">New case</button>' : '') + '</div><div class="fb"></div>';
    el.innerHTML = h;
    el.querySelectorAll('.tap').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, j = +b.dataset.j; const k = sym.indexOf(state[i][j]);
      state[i][j] = sym[(k + 1) % sym.length]; b.textContent = state[i][j]; b.classList.add('set'); b.classList.remove('right', 'wrong');

      let ok = true;
      el.querySelectorAll('.tap').forEach(b => { const i = +b.dataset.i, j = +b.dataset.j; const r = state[i][j] === v.answer[i][j]; ok = ok && r; b.classList.add(r ? 'right' : 'wrong') });

      shown.map(x => '<button class="item" data-i="' + x.i + '"><span>' + x.s + '</span><span class="num"></span></button>').join('') +
      '</div><div class="row"><button class="btn primary" id="chk">Check</button><button class="btn" id="clr">Start again</button></div><div class="fb"></div>';
    el.querySelectorAll('.item').forEach(b => b.onclick = () => { const i = +b.dataset.i, p = seq.indexOf(i); if (p >= 0) seq.splice(p, 1); else seq.push(i);
      el.querySelectorAll('.item').forEach(x => x.classList.remove('right', 'wrong')); draw() });
    el.querySelector('#clr').onclick = () => { seq = []; el.querySelectorAll('.item').forEach(x => x.classList.remove('right', 'wrong')); draw(); el.querySelector('.fb').innerHTML = '' };
    el.querySelector('#chk').onclick = () => {
      if (seq.length < c.steps.length) { fb(el, null, '<p>Number every step first.</p>'); return }
      let ok = true; el.querySelectorAll('.item').forEach(b => { const i = +b.dataset.i, r = seq.indexOf(i) === i; ok = ok && r; b.classList.add(r ? 'right' : 'wrong') });
      fb(el, ok, '<p><b>' + (ok ? 'Correct order.' : 'Not quite. The right order is:') + '</b></p>' + (ok ? '' : '<ol class="steps">' + c.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>') + (c.explain ? paras(c.explain) : ''));
    };
  }
};

const CALC = {
  rhig() {
    const kb = rnd(0.3, 3.0, 0.1), fetal = kb * 50, raw = fetal / 30, w = Math.floor(raw), d = raw - w, v = (d >= 0.5 ? w + 1 : w) + 1;
    return { q: 'A D-negative mother delivers a D-positive baby. How many 300 µg vials of RhIG does she need?',
      facts: ['Kleihauer–Betke: ' + fmt(kb, 1) + '% fetal cells', 'Maternal blood volume: 5000 mL'], label: 'Vials:', unit: '', answer: v, tol: 0, show: v + ' vials.',
      steps: ['Fetal blood = ' + fmt(kb, 1) + '% × 5000 mL = ' + fmt(fetal, 0) + ' mL', fmt(fetal, 0) + ' ÷ 30 = ' + fmt(raw, 2), 'Decimal ' + (d >= 0.5 ? '≥ 0.5: round up to ' + (w + 1) : '< 0.5: round down to ' + w), 'Add one vial: <b>' + v + '</b>'] };
  },
  hw() {
    const negPct = pick([9, 16, 25, 36, 49, 64, 4, 1]), q = Math.sqrt(negPct / 100), p = 1 - q, het = 2 * p * q * 100;
    return { q: 'In a population, ' + (100 - negPct) + '% of people are antigen-positive and ' + negPct + '% are antigen-negative (homozygous for the silent/recessive allele). What percentage are heterozygous?',
      facts: ['Hardy–Weinberg: p² + 2pq + q² = 1', 'Antigen-negative = q² = ' + (negPct / 100)], label: 'Heterozygous:', unit: '%', answer: het, tol: 0.6, show: fmt(het, 0) + '%.',
      steps: ['q² = ' + (negPct / 100) + ' → q = ' + fmt(q, 2), 'p = 1 − q = ' + fmt(p, 2), '2pq = 2 × ' + fmt(p, 2) + ' × ' + fmt(q, 2) + ' = ' + fmt(het / 100, 2) + ' → <b>' + fmt(het, 0) + '%</b>'] };
  },
  antneg() {
    const ab = [['anti-Fy<sup>a</sup>', 33], ['anti-S', 50], ['anti-E', 70], ['anti-K', 91], ['anti-c', 20], ['anti-Jk<sup>a</sup>', 23]];
    const a = shuffle(ab).slice(0, 2), units = pick([2, 3, 4]), f = a[0][1] / 100 * a[1][1] / 100, n = units / f;
    return { q: 'A patient has ' + a[0][0] + ' and ' + a[1][0] + '. The physician requests ' + units + ' units. About how many units must be screened?',
      facts: ['Compatible (antigen-negative) donors: ' + plain(a[0][0]).replace('anti-', '') + '-negative ≈ ' + a[0][1] + '%; ' + plain(a[1][0]).replace('anti-', '') + '-negative ≈ ' + a[1][1] + '%'], label: 'Units to screen:', unit: '',
      answer: n, tol: Math.max(1, n * 0.06), show: 'about ' + Math.round(n) + ' units.',
      steps: ['Compatible fraction = ' + (a[0][1] / 100) + ' × ' + (a[1][1] / 100) + ' = ' + fmt(f, 3), units + ' ÷ ' + fmt(f, 3) + ' = ' + fmt(n, 1) + ' → about <b>' + Math.round(n) + ' units</b>'] };
  },
  cci() {
    const pre = rnd(5, 15, 1) * 1000, inc = rnd(5, 40, 1) * 1000, post = pre + inc, bsa = rnd(1.5, 2.1, 0.1), dose = rnd(3, 4.5, 0.5), cci = inc * bsa / dose;
    return { q: 'A patient receives an apheresis platelet unit. Calculate the 1-hour corrected count increment (CCI).',
      facts: ['Pre-count: ' + pre.toLocaleString('en') + ' /µL', '1-hour post-count: ' + post.toLocaleString('en') + ' /µL', 'Body surface area: ' + fmt(bsa, 1) + ' m²', 'Platelets transfused: ' + fmt(dose, 1) + ' × 10¹¹'],
      label: 'CCI:', unit: '', answer: cci, tol: Math.max(150, cci * 0.03), show: Math.round(cci).toLocaleString('en') + '.',
      steps: ['Increment = ' + post.toLocaleString('en') + ' − ' + pre.toLocaleString('en') + ' = ' + inc.toLocaleString('en') + ' /µL', 'CCI = ' + inc.toLocaleString('en') + ' × ' + fmt(bsa, 1) + ' ÷ ' + fmt(dose, 1) + ' = <b>' + Math.round(cci).toLocaleString('en') + '</b>'],
      note: cci >= 7500 ? 'A 1-hour CCI of 7,500 or more is an adequate response.' : 'Below 7,500: inadequate response. Two consecutive inadequate CCIs define refractoriness.' };
  },
  rbcdose() {
    const kg = rnd(50, 90, 5), init = rnd(0.18, 0.24, 0.01), want = rnd(0.27, 0.32, 0.01), bv = kg * 70, n = bv * (want - init) / 200;
    return { q: 'How many red cell units are needed to reach the desired hematocrit?',
      facts: ['Weight: ' + kg + ' kg (blood volume ≈ 70 mL/kg)', 'Initial Hct: ' + fmt(init * 100, 0) + '%', 'Desired Hct: ' + fmt(want * 100, 0) + '%', 'Red cell volume per unit ≈ 200 mL'],
      label: 'Units:', unit: '', answer: n, tol: 0.25, show: fmt(n, 1) + ' → ' + Math.ceil(n) + ' units.',
      steps: ['Blood volume = ' + kg + ' × 70 = ' + bv + ' mL', bv + ' × (' + fmt(want, 2) + ' − ' + fmt(init, 2) + ') = ' + fmt(bv * (want - init), 0) + ' mL of red cells', fmt(bv * (want - init), 0) + ' ÷ 200 = <b>' + fmt(n, 1) + '</b>, so about ' + Math.ceil(n) + ' units'] };
  },
  indices() {
    const rbc = rnd(2.8, 5.8, 0.1), mcv = rnd(62, 112, 1), hct = +(rbc * mcv / 10).toFixed(1), mchc = rnd(29, 36, 0.5), hb = +(hct * mchc / 100).toFixed(1);
    const which = pick(['MCV', 'MCH', 'MCHC']);
    const val = { MCV: hct / rbc * 10, MCH: hb / rbc * 10, MCHC: hb / hct * 100 }[which];
    const unit = { MCV: 'fL', MCH: 'pg', MCHC: 'g/dL' }[which];
    const step = { MCV: 'MCV = Hct ÷ RBC × 10 = ' + hct + ' ÷ ' + rbc + ' × 10', MCH: 'MCH = Hb ÷ RBC × 10 = ' + hb + ' ÷ ' + rbc + ' × 10', MCHC: 'MCHC = Hb ÷ Hct × 100 = ' + hb + ' ÷ ' + hct + ' × 100' }[which];
    return { q: 'Calculate the <b>' + which + '</b>.', facts: ['RBC: ' + rbc + ' × 10¹²/L', 'Hemoglobin: ' + hb + ' g/dL', 'Hematocrit: ' + hct + '%'], label: which + ':', unit, answer: val, tol: which === 'MCHC' ? 0.3 : 0.6,
      show: fmt(val, 1) + ' ' + unit + '.', steps: [step + ' = <b>' + fmt(val, 1) + ' ' + unit + '</b>'],
      note: which === 'MCV' ? (val < 80 ? 'Microcytic.' : val > 100 ? 'Macrocytic.' : 'Normocytic.') : '' };
  },
  retic() {
    const hct = rnd(14, 44, 1), ret = rnd(1, 12, 0.5), cor = ret * hct / 45, mf = hct >= 36 ? 1 : hct >= 26 ? 1.5 : hct >= 16 ? 2 : 2.5, rpi = cor / mf;
    return { q: 'Calculate the reticulocyte production index (RPI).', facts: ['Reticulocytes: ' + ret + '%', 'Hematocrit: ' + hct + '%', 'Maturation correction: Hct 36–45 → 1.0; 26–35 → 1.5; 16–25 → 2.0; ≤ 15 → 2.5'],
      label: 'RPI:', unit: '', answer: rpi, tol: 0.15, show: fmt(rpi, 1) + '.',
      steps: ['Corrected retic = ' + ret + ' × ' + hct + ' ÷ 45 = ' + fmt(cor, 2) + '%', 'Maturation correction for Hct ' + hct + '% = ' + mf, 'RPI = ' + fmt(cor, 2) + ' ÷ ' + mf + ' = <b>' + fmt(rpi, 1) + '</b>'],
      note: rpi >= 3 ? 'RPI ≥ 3: adequate marrow response (e.g. hemolysis or bleeding).' : rpi < 2 ? 'RPI < 2: inadequate response (hypoproliferative or ineffective erythropoiesis).' : 'Borderline response.' };
  },
  nrbc() {
    const wbc = rnd(6, 30, 0.5), n = rnd(5, 60, 1), cor = wbc * 100 / (100 + n);
    return { q: 'The analyzer counts nucleated red cells as white cells. Correct the WBC count.', facts: ['WBC (uncorrected): ' + wbc + ' × 10⁹/L', 'NRBC on the smear: ' + n + ' per 100 WBCs'],
      label: 'Corrected WBC:', unit: '× 10⁹/L', answer: cor, tol: 0.15, show: fmt(cor, 1) + ' × 10⁹/L.', steps: ['Corrected WBC = ' + wbc + ' × 100 ÷ (100 + ' + n + ') = <b>' + fmt(cor, 1) + '</b>'] };
  },
  abs() {
    const wbc = rnd(2, 25, 0.5), cell = pick([['neutrophils', 40, 85], ['lymphocytes', 15, 70], ['eosinophils', 2, 25], ['monocytes', 3, 15]]), pct = rnd(cell[1], cell[2], 1), a = wbc * pct / 100;
    return { q: 'Calculate the absolute ' + cell[0] + ' count.', facts: ['WBC: ' + wbc + ' × 10⁹/L', cell[0][0].toUpperCase() + cell[0].slice(1) + ': ' + pct + '%'], label: 'Absolute count:', unit: '× 10⁹/L',
      answer: a, tol: 0.06, show: fmt(a, 2) + ' × 10⁹/L.', steps: ['Absolute count = WBC × % = ' + wbc + ' × ' + (pct / 100) + ' = <b>' + fmt(a, 2) + '</b>'] };
  },
  mentzer() {
    const thal = Math.random() < 0.5, rbc = thal ? rnd(5.2, 6.6, 0.1) : rnd(3.2, 4.4, 0.1), mcv = thal ? rnd(58, 70, 1) : rnd(66, 78, 1), idx = mcv / rbc;
    return { q: 'A patient has a microcytic anemia. Calculate the Mentzer index.', facts: ['MCV: ' + mcv + ' fL', 'RBC: ' + rbc + ' × 10¹²/L'], label: 'Mentzer index:', unit: '',
      answer: idx, tol: 0.15, show: fmt(idx, 1) + '.', steps: ['Mentzer index = MCV ÷ RBC = ' + mcv + ' ÷ ' + rbc + ' = <b>' + fmt(idx, 1) + '</b>'],
      note: idx < 13 ? 'Below 13: favors β-thalassemia trait. Confirm with Hb A<sub>2</sub> (> 3.5%).' : 'Above 13: favors iron deficiency. Confirm with ferritin.' };
  },
  inr() {
    const mn = rnd(11.5, 13, 0.5), pt = rnd(14, 40, 0.5), isi = pick([1.0, 1.1, 1.2, 1.3]), inr = Math.pow(pt / mn, isi);
    return { q: 'A patient on warfarin (vitamin K antagonist) has the following results. Calculate the INR.', facts: ['Patient PT: ' + pt + ' s', 'Mean normal PT: ' + mn + ' s', 'ISI of the reagent: ' + fmt(isi, 1)],
      label: 'INR:', unit: '', answer: inr, tol: 0.06, show: fmt(inr, 1) + '.', steps: ['Ratio = ' + pt + ' ÷ ' + mn + ' = ' + fmt(pt / mn, 2), 'INR = ' + fmt(pt / mn, 2) + '<sup>' + fmt(isi, 1) + '</sup> = <b>' + fmt(inr, 1) + '</b>'] };
  }
};
